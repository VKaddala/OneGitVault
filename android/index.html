<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OneGitVault — Open-Source APK & Repo Observatory</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" /></noscript>
    <style>
      :root {
        --status-bar-height: 42px;
        --nav-bar-height: 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        width: 100%;
        min-height: 100%;
        background-color: var(--bg-canvas, #000000);
      }
      body {
        font-family: 'Nunito', 'Google Sans', 'Google Sans Text', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary, #f0f6fc);
        overflow-x: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Allow text selection and copying inside README, code snippets, documentation and inputs */
      .markdown-body,
      .markdown-body *,
      pre,
      pre *,
      code,
      code *,
      input,
      textarea,
      [data-selectable="true"],
      .selectable-text,
      .selectable-text * {
        user-select: text !important;
        -webkit-user-select: text !important;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-launch-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000;z-index:99999;">
        <svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;filter:drop-shadow(0 10px 30px rgba(56,189,248,0.3));animation:ogvPulse 1.6s ease-in-out infinite;">
          <defs>
            <linearGradient id="ogv-splash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#020617" />
            </linearGradient>
            <linearGradient id="ogv-splash-border" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="50%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#ogv-splash-bg)" stroke="url(#ogv-splash-border)" stroke-width="3" />
          <polygon points="50,14 68,24 68,46 50,56 32,46 32,24" fill="#090d16" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" />
          <polygon points="50,28 52,33 57,34 53,37 54,42 50,39 46,42 47,37 43,34 48,33" fill="#fbbf24" />
          <polygon points="30,48 48,58 48,80 30,90 12,80 12,58" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
          <text x="30" y="73" font-family="Consolas, monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
          <polygon points="70,48 88,58 88,80 70,90 52,80 52,58" fill="#090d16" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round" />
          <circle cx="70" cy="63" r="3.2" fill="#a855f7" />
          <circle cx="63" cy="76" r="2.6" fill="#c084fc" />
          <circle cx="77" cy="76" r="2.6" fill="#c084fc" />
          <path d="M 70 65 L 70 69 M 70 69 L 63 74 M 70 69 L 77 74" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="50" cy="56" r="4.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
        </svg>
      </div>
      <style>
        @keyframes ogvPulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.06); opacity: 0.75; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
